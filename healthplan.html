        function bmipergender(weight, height, age, gender) {
            let bmi = weight / (height / 100) ** 2;
            let basicCalorires;
            if (gender === 'male') {
                basic = (weight * 10) + (height * 6.25) - (age * 5) + 5;
            }
            else if (gender === 'female') {
                basic = (weight * 10) + (height * 6.25) - (age * 5) - 161;
            }



            let target;

            if (bmi >= 30) {
                target = basic - 750;
            }
            else if (bmi >= 25) {
                target = basic - 500;
            }
            else {
                target = basic;
            }

            let category;

            if (bmi < 18.5) {
                category = "Underweight";
            }
            else if (bmi < 25) {
                category = "Normal weight";
            }
            else if (bmi < 30) {
                category = "Overweight";
            }
            else {
                category = "Obese";
            }

            return {
                bmi: bmi,
                target: target,
                basic: basic,
                category: category
            };
        }

        function findBestMealPlan(foods, target) {

            let bestCombo = [];
            let bestTotal = 0;
            const n = foods.length;

            for (let i = 0; i < 5000; i++) {

                let total = 0;

                // Copy food database
                for (let j = 0; j < n; j++) {
                    shuffledFoods[j] = foods[j];
                }

                // Shuffle foods
                for (let j = n - 1; j > 0; j--) {

                    let randomIndex = Math.floor(Math.random() * (j + 1));
                    // learnt this in CSCI A146 
                    let temp = shuffledFoods[j];
                    shuffledFoods[j] = shuffledFoods[randomIndex];
                    shuffledFoods[randomIndex] = temp;
                }
