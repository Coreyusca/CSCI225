
<!DOCTYPE html>
<html>
<head>
  <title>Matching Game</title>
  <style>
    .card {
      width: 80px;
      height: 80px;
      font-size: 35px;
      margin: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Matching Game</h1>
<div id="game"></div>

<script>
const cards = ["3", "2", "1",
               "3", "2", "1"];

let firstCard = null;
let secondCard = null;
let matches = 0;

cards.sort(() => Math.random() - 0.5);

const game = document.getElementById("game");

cards.forEach((play) => {
  const card = document.createElement("button");

  card.className = "card";
  card.textContent = "?";

  card.onclick = function() {
    if (card.textContent !== "?") return;
    if (secondCard !== null) return;

    card.textContent = play;

    if (firstCard === null) {
      firstCard = card;
    } else {
      secondCard = card;

      if (firstCard.textContent ===
          secondCard.textContent) {
        matches++;
        firstCard = null;
        secondCard = null;

        if (matches === 3) {
          alert("You won!");
        }
      } else {
        setTimeout(() => {
          firstCard.textContent = "?";
          secondCard.textContent = "?";
          firstCard = null;
          secondCard = null;
        }, 1000);
      }
    }
  };

  game.appendChild(card);
});
</script>

</body>
</html>
